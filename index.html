<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ChranaBaby</title>
  <link rel="icon" type="image/png" href="favicon.png" />
<style>
  body, html {
    margin: 0; padding: 0; height: 100%;
    overflow: hidden;
  }
  body {
    background: #135991 url("ocean-background.jpg") center / cover no-repeat fixed;
  }
 .content {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding-top: 50px;
}
.btn {
  display: block;
  width: 100%;
  max-width: 300px;
  font-family: Verdana, sans-serif;
  color: #00aff0;
  background-color: #fff;
  box-shadow: 0 0 16px rgba(255, 255, 255, 0.8);
  padding: 14px 28px;
  margin: 0;
  border: none;
  border-radius: 50px;
  text-decoration: none;
  font-size: 1em;
  font-weight: bold;
  text-align: center; 
  transition: background-color 0.3s ease;
}

.btn:hover {
  background-color: #f0fbff;
}
   .footer {
    margin-top: 100px;
    font-size: 0.9em;
    color: #ccc;
  }

  .profile-pic {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    object-fit: cover;
    margin-bottom: 20px;
    border: 3px solid #fff;
  }
</style>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-ZCMY9K9K16"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-ZCMY9K9K16');
</script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    document.querySelectorAll('[data-gtag-event]').forEach(link => {
      link.addEventListener('click', () => {
        const eventName = link.getAttribute('data-gtag-event');
        gtag('event', eventName, {
          event_category: 'link',
          event_label: link.href
        });
      });
    });
  });
</script>
</head>
  <body oncontextmenu="return false;">
  <div class="content">
  <img src="anime-profile.jpg" alt="chranababy" class="profile-pic" oncontextmenu="return false;" draggable="false" />
<a href="https://www.instagram.com/bby.chrana/" target="_blank" rel="noopener" id="instagram-profile" data-gtag-event="instagram_click" class="btn">CLICK HERE 🤍💙</a>
    <div class="footer">© chranababy.com</div>
  </div>
<script>
  const instagramProfile = document.getElementById('instagram-profile');

  instagramProfile.addEventListener('click', (event) => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

    const profileUrl = instagramProfile.href;
    const username = instagramProfile.pathname.split('/')[1];
    const userAgent = navigator.userAgent;

    if (/Android/i.test(userAgent)) {
      event.preventDefault();
      const fallback = encodeURIComponent(profileUrl);
      window.location.href = `intent://${instagramProfile.host}${instagramProfile.pathname}#Intent;scheme=https;package=com.instagram.android;S.browser_fallback_url=${fallback};end`;
      return;
    }

    if (/iPhone|iPad|iPod/i.test(userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) {
      event.preventDefault();

      const clearFallback = () => {
        window.clearTimeout(fallback);
        document.removeEventListener('visibilitychange', onVisibilityChange);
        window.removeEventListener('pagehide', clearFallback);
      };
      const onVisibilityChange = () => {
        if (document.hidden) clearFallback();
      };
      const fallback = window.setTimeout(() => {
        const isVisible = !document.hidden;
        clearFallback();
        if (isVisible) window.location.href = profileUrl;
      }, 1800);

      document.addEventListener('visibilitychange', onVisibilityChange);
      window.addEventListener('pagehide', clearFallback);
      window.location.href = `instagram://user?username=${encodeURIComponent(username)}`;
    }
  });
</script>
</body>
</html>
